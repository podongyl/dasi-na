<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다시, 나 - 김예지 포트폴리오</title>
    
    <!-- Google Fonts: Noto Sans KR 폰트 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 헤더 영역: 로고 및 내비게이션 -->
    <header>
        <h1>다시, 나</h1>
        <nav>
            <ul>
                <li><a href="#about">소개</a></li>
                <li><a href="#experience">경력</a></li>
                <li><a href="#skills">역량</a></li>
                <li><a href="#education">교육·자격</a></li>
                <li><a href="#contact">문의</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main>
        <!-- 1. 소개 섹션 -->
        <section id="about">
            <h2>소개</h2>
            <!-- 프로필 이미지 (가상 이미지 플레이스홀더 사용) -->
            <img src="https://placehold.co/300x300?text=Profile" width="300" height="300" alt="김예지 프로필 사진">
            <h3>김예지</h3>
            <p>콘텐츠 제작 현장의 문제 상황을 찾아내고, 여러 이해관계자와 조율하며 해결해온 3년차 제작 PD 입니다.</p>
        </section>

        <!-- 2. 경력 섹션 -->
        <section id="experience">
            <h2>경력</h2>
            <!-- 향후 경력 상세 내용이 들어갈 자리 -->
            <p>경력 사항 업데이트 예정</p>
        </section>

        <!-- 3. 역량 섹션 -->
        <section id="skills">
            <h2>역량</h2>
            <!-- 향후 보유 스킬 내용이 들어갈 자리 -->
            <p>핵심 역량 업데이트 예정</p>
        </section>

        <!-- 4. 교육 및 자격 섹션 -->
        <section id="education">
            <h2>교육·자격</h2>
            <!-- 향후 학력 및 자격증 내용이 들어갈 자리 -->
            <p>교육 및 자격 사항 업데이트 예정</p>
        </section>

        <!-- 5. 문의 섹션 -->
        <section id="contact">
            <h2>문의</h2>
            <!-- 향후 이메일 등 연락처 정보가 들어갈 자리 -->
            <p>연락처 업데이트 예정</p>
        </section>
    </main>

    <!-- 푸터 영역: 저작권 정보 등 -->
    <footer>
        <p>&copy; 2026 김예지. All rights reserved.</p>
    </footer>

    <!-- 외부 JavaScript 파일 연결 (<body> 태그가 닫히기 직전에 넣는 것이 좋습니다) -->
    <script src="js/script.js"></script>
</body>
</html>
